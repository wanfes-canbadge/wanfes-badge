<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fffaf5">
<title>わんフェス｜缶バッジ写真づくり</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#fffaf5;color:#333;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  .wrap{max-width:720px;margin:auto;padding:18px 16px 28px}
  h1{text-align:center;font-size:24px;margin:4px 0 6px}
  .lead{text-align:center;font-size:14px;line-height:1.6;margin:0 0 14px}
  .panel{background:#fff;border-radius:18px;padding:16px;box-shadow:0 2px 12px rgba(0,0,0,.07);margin-bottom:14px}
  label.pick{display:block;background:#f2e6d5;border-radius:14px;padding:14px;text-align:center;font-weight:700;cursor:pointer}
  input[type=file]{display:none}
  .stage-wrap{display:none}
  canvas{display:block;width:min(86vw,520px);height:min(86vw,520px);margin:10px auto;background:#eee;border-radius:14px;touch-action:none}
  .note{font-size:13px;line-height:1.7;text-align:center;margin:8px 0}
  .legend{display:flex;justify-content:center;gap:14px;font-size:12px;flex-wrap:wrap}
  .dot{display:inline-block;width:12px;height:12px;border:2px solid;border-radius:50%;vertical-align:-2px;margin-right:4px}
  .visible{border-color:#e58b52}.wrapin{border-color:#777;border-style:dashed}
  .controls{display:flex;gap:8px;justify-content:center;margin:10px 0}
  button{border:0;border-radius:12px;padding:12px 15px;font-size:15px;font-weight:700;background:#eee;color:#333}
  button.primary{background:#d98255;color:#fff}
  button:disabled{opacity:.45}
  .actions{display:flex;gap:10px}
  .actions button{flex:1}
  .small{font-size:11px;color:#777;text-align:center;line-height:1.5}
  #done{display:none}
  #status{font-size:13px;text-align:center;margin-top:8px;min-height:1.4em}
</style>
</head>
<body>
<div class="wrap">
  <h1>🐶 わんフェス 缶バッジづくり</h1>
  <p class="lead">好きな写真を選んで、完成した缶バッジをイメージしながら位置と大きさを調整してね！</p>

  <div class="panel">
    <label class="pick" for="file">📷 写真を選ぶ</label>
    <input id="file" type="file" accept="image/*">

    <div class="stage-wrap" id="stageWrap">
      <canvas id="canvas" width="900" height="900"></canvas>
      <div class="legend">
        <span><i class="dot visible"></i>ここが表に見える範囲</span>
        <span><i class="dot wrapin"></i>ここから外は裏側へ</span>
      </div>
      <p class="note">写真を<strong>指1本で移動</strong>、<strong>2本指で拡大・縮小</strong>できます。<br>
      ペットの顔など、残したい部分を「表に見える範囲」の中に入れてね。</p>
      <div class="controls">
        <button id="reset">↺ 写真をリセット</button>
      </div>
      <div class="actions">
        <button id="done" class="primary">✅ この写真で完成</button>
      </div>
      <div id="status">写真を選ぶと、ここに編集画面が表示されます。</div>
    </div>
  </div>

  <div class="panel" id="result" style="display:none">
    <h2 style="font-size:18px;text-align:center;margin:0 0 8px">完成！🎉</h2>
    <img id="preview" alt="完成画像" style="display:block;width:80%;max-width:360px;margin:auto;border-radius:50%">
    <p class="note">まず画像を保存して、その画像をわんフェス受付のLINEへ送ってね。</p>
    <div class="actions">
      <button id="save" class="primary">⬇️ 画像を保存</button>
      <button id="again">写真をやり直す</button>
    </div>
    <p class="small">※「保存」を押しても保存先が表示されない場合は、画像を長押しして保存してください。</p>
  </div>
</div>

<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
const file=document.getElementById('file'),stageWrap=document.getElementById('stageWrap');
const result=document.getElementById('result'),preview=document.getElementById('preview');
const done=document.getElementById('done'),statusEl=document.getElementById('status');
const resetBtn=document.getElementById('reset'),again=document.getElementById('again'),save=document.getElementById('save');

let img=null, baseScale=1, scale=1, x=450, y=450, startX=0,startY=0,startDist=0,startScale=1,drag=false;

const R_VISIBLE=330;   // 完成時に表に見える円
const R_WRAP=430;      // 用紙上に残す外側（巻き込み）円

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  ctx.beginPath();ctx.arc(450,450,R_WRAP,0,Math.PI*2);ctx.clip();
  if(img){
    const w=img.naturalWidth,h=img.naturalHeight;
    const s=baseScale*scale;
    ctx.drawImage(img,x-w*s/2,y-h*s/2,w*s,h*s);
  }
  ctx.restore();

  // 巻き込み領域
  ctx.save();
  ctx.beginPath();ctx.arc(450,450,R_VISIBLE,0,Math.PI*2);ctx.clip();
  ctx.globalAlpha=.10;ctx.fillStyle="#ffffff";ctx.fillRect(0,0,900,900);
  ctx.restore();

  // ガイド
  ctx.save();
  ctx.setLineDash([]);
  ctx.lineWidth=5;ctx.strokeStyle="#e58b52";
  ctx.beginPath();ctx.arc(450,450,R_VISIBLE,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([14,12]);ctx.lineWidth=4;ctx.strokeStyle="#777";
  ctx.beginPath();ctx.arc(450,450,R_WRAP,0,Math.PI*2);ctx.stroke();
  ctx.restore();

  ctx.font="bold 24px sans-serif";ctx.textAlign="center";
  ctx.fillStyle="#e58b52";ctx.fillText("表に見える範囲",450,450-R_VISIBLE-18);
  ctx.fillStyle="#666";ctx.font="20px sans-serif";ctx.fillText("ここから外は裏側へ",450,450+R_WRAP+30);
}

function fit(){
  const w=img.naturalWidth,h=img.naturalHeight;
  baseScale=Math.max((R_WRAP*2)/w,(R_WRAP*2)/h);
  scale=1;x=450;y=450;draw();
}
file.addEventListener('change', e => {
  const f = e.target.files && e.target.files[0];
  if (!f) return;

  statusEl.textContent = "写真を読み込んでいます…";

  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();

    im.onload = () => {
      img = im;
      stageWrap.style.display = "block";
      result.style.display = "none";
      done.style.display = "block";
      statusEl.textContent = "写真を調整してください";
      fit();
    };

    im.onerror = () => {
      statusEl.textContent = "この写真を読み込めませんでした。別の写真で試してください。";
    };

    im.src = reader.result;
  };

  reader.onerror = () => {
    statusEl.textContent = "写真の読み込みに失敗しました。";
  };

  reader.readAsDataURL(f);
});
resetBtn.onclick=()=>{if(img)fit()};

function dist(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}
canvas.addEventListener('pointerdown',e=>{
  canvas.setPointerCapture(e.pointerId);
  if(e.pointerType==="touch" && e.isPrimary){drag=true;startX=e.clientX;startY=e.clientY;canvas._last={x:e.clientX,y:e.clientY}}
  else if(e.pointerType==="mouse"){drag=true;startX=e.clientX;startY=e.clientY}
});
canvas.addEventListener('pointermove',e=>{
  if(!drag||!img)return;
  const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;
  if(e.pointerType==="mouse" || e.isPrimary){x+=(e.clientX-startX)*sx;y+=(e.clientY-startY)*sy;startX=e.clientX;startY=e.clientY;draw()}
});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('pointercancel',()=>drag=false);

// タッチのピンチは独自に処理
let touches=new Map();
canvas.addEventListener('touchstart',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)touches.set(t.identifier,t);
  if(touches.size===2){
    const a=[...touches.values()][0],b=[...touches.values()][1];
    startDist=dist(a,b);startScale=scale;
  }
},{passive:false});
canvas.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches)touches.set(t.identifier,t);
  const vals=[...touches.values()];
  if(vals.length===2){
    const d=dist(vals[0],vals[1]);
    scale=Math.max(.2,Math.min(6,startScale*d/startDist));draw();
  }else if(vals.length===1){
    const t=vals[0];
    if(!canvas._last)canvas._last={x:t.clientX,y:t.clientY};
    const r=canvas.getBoundingClientRect(),sx=canvas.width/r.width,sy=canvas.height/r.height;
    x+=(t.clientX-canvas._last.x)*sx;y+=(t.clientY-canvas._last.y)*sy;
    canvas._last={x:t.clientX,y:t.clientY};draw();
  }
},{passive:false});
canvas.addEventListener('touchend',e=>{
  for(const t of e.changedTouches)touches.delete(t.identifier);
  canvas._last=null;
});

function makeOutput(){
  const out=document.createElement('canvas');out.width=900;out.height=900;
  const c=out.getContext('2d');
  c.clearRect(0,0,900,900);
  c.save();c.beginPath();c.arc(450,450,R_WRAP,0,Math.PI*2);c.clip();
  const w=img.naturalWidth,h=img.naturalHeight,s=baseScale*scale;
  c.drawImage(img,x-w*s/2,y-h*s/2,w*s,h*s);c.restore();

  // 表面として見える範囲だけ透明、それより外はそのまま残す。
  // 印刷用に円形画像として保存するため外側を透明化。
  c.globalCompositeOperation="destination-in";
  c.beginPath();c.arc(450,450,R_WRAP,0,Math.PI*2);c.fill();
  return out;
}
done.onclick=()=>{
  if(!img)return;
  const out=makeOutput();
  preview.src=out.toDataURL("image/png");
  result.style.display="block";
  result.scrollIntoView({behavior:"smooth"});
  statusEl.textContent="完成画像ができました！下の「画像を保存」を押してね。";
};
save.onclick=()=>{
  const a=document.createElement('a');a.href=preview.src;a.download="wanfes_badge_32mm.png";a.click();
};
again.onclick=()=>{result.style.display="none";window.scrollTo({top:0,behavior:"smooth"})};
</script>
</body>
</html>
